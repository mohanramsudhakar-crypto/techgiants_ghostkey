<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ghost Key Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

</head>

<body>

<div class="container">

    <header>

        <div>

            <h1>GHOST KEY</h1>

            <p>
                Context-Aware Access Control
            </p>

        </div>

        <div
            id="status"
            class="status"
        >
            ● SERVER OFFLINE
        </div>

    </header>


    <!-- ================================================= -->
    <!-- STATISTICS -->
    <!-- ================================================= -->

    <section class="stats">

        <div class="card">

            <h3>Total Attempts</h3>

            <div
                id="total"
                class="number"
            >
                0
            </div>

        </div>


        <div class="card">

            <h3>Allowed</h3>

            <div
                id="allowed"
                class="number"
            >
                0
            </div>

        </div>


        <div class="card">

            <h3>Blocked</h3>

            <div
                id="blocked"
                class="number"
            >
                0
            </div>

        </div>


        <div class="card">

            <h3>Critical</h3>

            <div
                id="critical"
                class="number"
            >
                0
            </div>

        </div>

    </section>


    <!-- ================================================= -->
    <!-- NODES -->
    <!-- ================================================= -->

    <section>

        <h2>Active Readers</h2>

        <div class="nodes">

            <div class="node">

                <h3>READER_001</h3>

                <p>
                    Chennai Lab A
                </p>

                <span class="online">
                    PHYSICAL NODE
                </span>

            </div>


            <div class="node">

                <h3>READER_002</h3>

                <p>
                    Chennai Lab B
                </p>

                <span class="online">
                    PHYSICAL NODE
                </span>

            </div>

        </div>

    </section>


    <!-- ================================================= -->
    <!-- LIVE EVENTS -->
    <!-- ================================================= -->

    <section>

        <h2>Live Security Events</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Time</th>

                        <th>Card</th>

                        <th>User</th>

                        <th>Reader</th>

                        <th>Location</th>

                        <th>Risk</th>

                        <th>Decision</th>

                        <th>Reason</th>

                    </tr>

                </thead>

                <tbody id="events">

                </tbody>

            </table>

        </div>

    </section>

</div>


<script src="app.js"></script>

</body>

</html>
